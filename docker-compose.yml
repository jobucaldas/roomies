version: "3.9"

services:
  db:
    image: docker.io/postgres:16-alpine
    environment:
      POSTGRES_USER: roomies
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: roomies
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roomies -d roomies"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: src/backend
      dockerfile: Dockerfile
    command: ["serve"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}
      PORT: "8080"
      WORKER_HEALTH_PORT: "8081"
      APP_ENV: production
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost}
      ROOMIES_PUBLIC_BASE_URL: ${ROOMIES_PUBLIC_BASE_URL:-http://localhost}
      INVITATION_TTL_HOURS: ${INVITATION_TTL_HOURS:-168}
      JOB_POLL_INTERVAL_SECONDS: ${JOB_POLL_INTERVAL_SECONDS:-2}
      JOB_LEASE_SECONDS: ${JOB_LEASE_SECONDS:-30}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-Roomies <no-reply@roomies.local>}
    ports:
      - "${ROOMIES_BACKEND_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/readyz"]
      interval: 30s
      timeout: 5s
      retries: 3

  worker:
    build:
      context: src/backend
      dockerfile: Dockerfile
    command: ["worker"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}
      PORT: "8080"
      WORKER_HEALTH_PORT: "8081"
      APP_ENV: production
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost}
      ROOMIES_PUBLIC_BASE_URL: ${ROOMIES_PUBLIC_BASE_URL:-http://localhost}
      INVITATION_TTL_HOURS: ${INVITATION_TTL_HOURS:-168}
      JOB_POLL_INTERVAL_SECONDS: ${JOB_POLL_INTERVAL_SECONDS:-2}
      JOB_LEASE_SECONDS: ${JOB_LEASE_SECONDS:-30}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-Roomies <no-reply@roomies.local>}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/readyz"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: src/app/Dockerfile
      args:
        ROOMIES_API_URL: ${ROOMIES_API_URL:-/api}
    volumes:
      - frontend_dist:/export
    depends_on:
      backend:
        condition: service_healthy
    command: ["/bin/sh", "-c", "cp -a /app/dist/. /export/ && tail -f /dev/null"]

  caddy:
    image: docker.io/caddy:2.8-alpine
    ports:
      - "${ROOMIES_HTTP_PORT:-80}:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - frontend_dist:/usr/share/caddy/html
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started

volumes:
  pgdata:
  frontend_dist:
