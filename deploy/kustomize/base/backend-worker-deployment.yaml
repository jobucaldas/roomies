apiVersion: apps/v1
kind: Deployment
metadata:
  name: roomies-backend-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: backend-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/component: backend-worker
    spec:
      containers:
        - name: backend-worker
          image: roomies-backend:latest
          imagePullPolicy: IfNotPresent
          args: ["worker"]
          ports:
            - name: health
              containerPort: 8081
          envFrom:
            - secretRef:
                name: roomies-secrets
            - configMapRef:
                name: roomies-backend-config
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
