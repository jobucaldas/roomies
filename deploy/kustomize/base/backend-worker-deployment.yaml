apiVersion: apps/v1
kind: Deployment
metadata:
  name: roomies-backend-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: backend-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/component: backend-worker
    spec:
      securityContext:
        runAsNonRoot: true
        fsGroup: 101
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: tmp
          emptyDir: {}
      containers:
        - name: backend-worker
          image: roomies-backend:latest
          imagePullPolicy: IfNotPresent
          args: ["worker"]
          securityContext:
            runAsNonRoot: true
            runAsUser: 100
            runAsGroup: 101
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: health
              containerPort: 8081
          envFrom:
            - secretRef:
                name: roomies-secrets
            - configMapRef:
                name: roomies-backend-config
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
