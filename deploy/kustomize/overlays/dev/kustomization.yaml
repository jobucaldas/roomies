apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: roomies-dev

resources:
  - ../../base
  - namespace.yaml
  - ingress.yaml
  - nightly-updater.yaml

images:
  - name: roomies-backend
    newName: ghcr.io/jobucaldas/roomies-backend
    newTag: nightly
  - name: roomies-frontend
    newName: ghcr.io/jobucaldas/roomies-frontend
    newTag: nightly

patches:
  - path: image-pull-secrets.yaml
    target:
      kind: Deployment
  - path: pull-always.yaml

configMapGenerator:
  - name: roomies-backend-config
    literals:
      - APP_ENV=development
      - PORT=8080
      - WORKER_HEALTH_PORT=8081
      - CORS_ALLOWED_ORIGINS=https://roomies-dev.jobucaldas.com
      - ROOMIES_PUBLIC_BASE_URL=https://roomies-dev.jobucaldas.com
      - INVITATION_TTL_HOURS=168
      - JOB_POLL_INTERVAL_SECONDS=2
      - JOB_LEASE_SECONDS=30
      - WEB_PUSH_SUBJECT=mailto:no-reply@roomies-dev.jobucaldas.com
      - TIMEZONE=UTC

generatorOptions:
  disableNameSuffixHash: true
