name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: roomies
          POSTGRES_PASSWORD: roomies
          POSTGRES_DB: roomies
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: src/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - run: go test ./...
        env:
          DATABASE_URL: sqlite://ci.db
          JWT_SECRET: ci-only-secret
      - run: go test ./...
        env:
          DATABASE_URL: postgres://roomies:roomies@localhost:5432/roomies?sslmode=disable
          JWT_SECRET: ci-only-secret

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p roomies-app --no-default-features --features web
      - run: cargo check -p roomies-app --no-default-features --features web
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev
      - run: cargo check -p roomies-app --no-default-features --features desktop

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compose config
        run: docker compose config
        env:
          DATABASE_URL: postgres://roomies:ci-password@db:5432/roomies?sslmode=disable
          POSTGRES_PASSWORD: ci-password
          JWT_SECRET: ci-only-secret
      - name: Build and health smoke
        run: |
          docker compose up -d --build
          trap 'docker compose down -v' EXIT
          timeout 120 sh -c 'until curl -fsS http://localhost:58080/healthz; do sleep 2; done'
          curl -fsS http://localhost:58000/ >/dev/null
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://localhost:58000/api/auth/me)" = 401
        env:
          DATABASE_URL: postgres://roomies:ci-password@db:5432/roomies?sslmode=disable
          POSTGRES_PASSWORD: ci-password
          JWT_SECRET: ci-only-secret
          CORS_ALLOWED_ORIGINS: http://localhost:58000
          ROOMIES_BACKEND_PORT: 58080
          ROOMIES_HTTP_PORT: 58000
          ROOMIES_DB_PORT: 55432

  household-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Configure disposable stack
        shell: bash
        run: |
          set -euo pipefail
          password="$(openssl rand -hex 32)"
          {
            echo "COMPOSE_PROJECT_NAME=roomies-household-${GITHUB_RUN_ID}"
            echo "POSTGRES_PASSWORD=${password}"
            echo "DATABASE_URL=postgres://roomies:${password}@db:5432/roomies?sslmode=disable"
            echo "JWT_SECRET=$(openssl rand -hex 48)"
            echo "CORS_ALLOWED_ORIGINS=http://localhost:58000"
            echo "ROOMIES_PUBLIC_BASE_URL=http://localhost:58000"
            echo "ROOMIES_BACKEND_PORT=58080"
            echo "ROOMIES_HTTP_PORT=58000"
            echo "SMTP_HOST=mailpit"
            echo "SMTP_PORT=1025"
          } >> "$GITHUB_ENV"
      - name: Build and start household stack
        run: |
          docker compose -p "$COMPOSE_PROJECT_NAME" -f docker-compose.yml -f e2e/docker-compose.mailpit.yml up -d --build
          timeout 180 sh -c 'until curl -fsS http://localhost:58080/healthz; do sleep 2; done'
          timeout 60 sh -c 'until curl -fsS http://localhost:58000/ >/dev/null; do sleep 2; done'
      - name: Run household desktop and narrow flow
        working-directory: e2e
        env:
          ROOMIES_E2E_COMMAND: npx playwright test tests/household.spec.ts
          ROOMIES_WEB_URL: http://localhost:58000
          ROOMIES_API_URL: http://localhost:58000/api
        run: GIT_COMMIT="$(git rev-parse HEAD)" npx playwright test tests/household.spec.ts
      - name: Upload sanitized household evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: household-browser-evidence-${{ github.run_id }}
          path: e2e/artifacts/evidence/*.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Tear down household stack
        if: always()
        run: docker compose -p "$COMPOSE_PROJECT_NAME" -f docker-compose.yml -f e2e/docker-compose.mailpit.yml down --volumes --remove-orphans

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973"
      - run: cargo install dioxus-cli --version 0.7.9 --locked
      - run: dx build --release --android
        working-directory: src/app
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
