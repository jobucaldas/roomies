name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pre-commit
      - run: pre-commit run --show-diff-on-failure --color=always --all-files

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.8'
      - run: go vet ./...
        working-directory: src/backend
        env:
          GOTOOLCHAIN: local

  backend:
    env:
      GOTOOLCHAIN: local
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: roomies
          POSTGRES_PASSWORD: roomies
          POSTGRES_DB: roomies
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: src/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.8'
      - run: go test ./...
        env:
          DATABASE_URL: sqlite://ci.db
          JWT_SECRET: ci-only-secret
      - run: go test ./...
        env:
          DATABASE_URL: postgres://roomies:roomies@localhost:5432/roomies?sslmode=disable
          JWT_SECRET: ci-only-secret

  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.27.1'
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Build web bundle
        run: |
          flutter build web --release --no-web-resources-cdn --dart-define=ROOMIES_API_URL=/api
          printf 'BUILD_SHA=%s\n' "$GITHUB_SHA" > build/web/BUILD_SHA.txt
      - uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: src/frontend/build/web
          retention-days: 3

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.27.1'
          channel: stable
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # Install the SDK and accept licenses instead of relying on the runner
      # image. Third-party actions are pinned to a commit because this job can
      # hold the signing key.
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          # The default also requests the obsolete "tools" package, which
          # current cmdline-tools no longer provide. Gradle fetches the
          # platform and build-tools it needs once licenses are accepted.
          packages: platform-tools
      - name: Configure release signing
        # Only pushes to main get the upload key; other branches and pull
        # requests (including forks, which never see secrets) build with debug
        # keys, so a release-signed APK is never published from unreviewed code.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "No ANDROID_KEYSTORE_BASE64 secret: release APK uses debug keys."
            exit 0
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          {
            echo "storeFile=app/upload-keystore.jks"
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=${ANDROID_KEY_PASSWORD:-$ANDROID_KEYSTORE_PASSWORD}"
          } > android/key.properties
      - run: flutter pub get
      - run: flutter build apk --release --dart-define=ROOMIES_API_URL=
      - uses: actions/upload-artifact@v4
        with:
          name: roomies-android-apk-${{ github.sha }}
          path: src/frontend/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

  windows:
    # Flutter 3.27 only detects Visual Studio up to 2022.
    runs-on: windows-2022
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.27.1'
          channel: stable
      - run: flutter pub get
      - run: flutter build windows --release --dart-define=ROOMIES_API_URL=
      - uses: actions/upload-artifact@v4
        with:
          name: roomies-windows-x64-${{ github.sha }}
          path: src/frontend/build/windows/x64/runner/Release/
          if-no-files-found: error
          retention-days: 14

  linux-appimage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.27.1'
          channel: stable
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev desktop-file-utils
          curl -fsSLo "$RUNNER_TEMP/appimagetool" \
            https://github.com/AppImage/appimagetool/releases/download/1.9.0/appimagetool-x86_64.AppImage
          chmod +x "$RUNNER_TEMP/appimagetool"
      - run: flutter pub get
        working-directory: src/frontend
      - run: flutter build linux --release --dart-define=ROOMIES_API_URL=
        working-directory: src/frontend
      - name: Package AppImage
        working-directory: src/frontend/build/linux
        env:
          APPIMAGETOOL: ${{ runner.temp }}/appimagetool
          # Runners have no FUSE; unpack appimagetool instead of mounting it.
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          set -euo pipefail
          rm -rf Roomies.AppDir
          cp -a x64/release/bundle Roomies.AppDir
          cp ../../web/icons/Icon-512.png Roomies.AppDir/roomies.png
          cat > Roomies.AppDir/roomies.desktop <<'DESKTOP'
          [Desktop Entry]
          Type=Application
          Name=Roomies
          Exec=roomies
          Icon=roomies
          Categories=Office;
          DESKTOP
          cat > Roomies.AppDir/AppRun <<'APPRUN'
          #!/bin/sh
          here="$(dirname "$(readlink -f "$0")")"
          exec "$here/roomies" "$@"
          APPRUN
          chmod +x Roomies.AppDir/AppRun
          ARCH=x86_64 "$APPIMAGETOOL" Roomies.AppDir Roomies-x86_64.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: roomies-linux-appimage-${{ github.sha }}
          path: src/frontend/build/linux/Roomies-x86_64.AppImage
          if-no-files-found: error
          retention-days: 14

  # Builds the images CI publishes and runs the README compose file against them.
  images:
    needs: flutter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web-build
          path: src/frontend/build/web
      - name: Development compose config
        run: docker compose config -q
      - name: Build images
        run: |
          docker build -t ghcr.io/jobucaldas/roomies-backend:nightly src/backend
          docker build --target prebuilt -t ghcr.io/jobucaldas/roomies-frontend:nightly src/frontend
      - name: Run the README compose file
        run: |
          mkdir smoke
          awk '/^```yaml$/{f=1;next} /^```$/{f=0} f' README.md > smoke/compose.yaml
          printf '%s\n' POSTGRES_PASSWORD="$(openssl rand -hex 24)" JWT_SECRET="$(openssl rand -hex 48)" \
            ROOMIES_PUBLIC_BASE_URL=http://localhost:8080 > smoke/.env
          cd smoke
          docker compose pull db
          docker compose up -d --pull never
          timeout 120 sh -c 'until curl -fsS http://localhost:8080/ >/dev/null; do sleep 2; done'
          for _ in $(seq 1 60); do
            [ "$(curl -sS -o /dev/null -w '%{http_code}' http://localhost:8080/api/auth/me)" = 401 ] && break
            sleep 2
          done
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://localhost:8080/api/auth/me)" = 401
          curl -fsS http://localhost:8080/some/deep/link | grep -qi '<html'
          test "$(docker compose ps --status running -q | wc -l)" = 4
      - if: failure()
        run: cd smoke && docker compose logs

  # Main-only: publish the backend and frontend images.
  ghcr-images:
    name: GHCR images (nightly + datetime_sha)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [pre-commit, lint, backend, flutter, images]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web-build
          path: src/frontend/build/web
      - name: Compute image tags
        id: tags
        env:
          COMMIT_TIMESTAMP: ${{ github.event.head_commit.timestamp }}
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA:0:7}"
          if [ -n "${COMMIT_TIMESTAMP}" ]; then
            dt="$(date -u -d "${COMMIT_TIMESTAMP}" +%Y%m%d%H%M%S)"
          else
            dt="$(date -u +%Y%m%d%H%M%S)"
          fi
          echo "datetime_sha=${dt}_${short_sha}" >> "${GITHUB_OUTPUT}"
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "${GITHUB_OUTPUT}"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push backend
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: src/backend
          file: src/backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.tags.outputs.owner }}/roomies-backend:nightly
            ghcr.io/${{ steps.tags.outputs.owner }}/roomies-backend:dev
            ghcr.io/${{ steps.tags.outputs.owner }}/roomies-backend:${{ steps.tags.outputs.datetime_sha }}
      - name: Build and push frontend
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: src/frontend
          target: prebuilt
          push: true
          tags: |
            ghcr.io/${{ steps.tags.outputs.owner }}/roomies-frontend:nightly
            ghcr.io/${{ steps.tags.outputs.owner }}/roomies-frontend:dev
            ghcr.io/${{ steps.tags.outputs.owner }}/roomies-frontend:${{ steps.tags.outputs.datetime_sha }}
