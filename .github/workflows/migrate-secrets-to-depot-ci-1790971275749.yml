name: Import secrets and variables to Depot CI
on: push

permissions:
  id-token: write
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: depot/setup-action@v1
      - name: Import secrets
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
          TS_AUDIENCE: ${{ secrets.TS_AUDIENCE }}
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
        run: |
          unset DEPOT_TOKEN
          depot ci secrets add KUBE_CONFIG="$KUBE_CONFIG" TS_AUDIENCE="$TS_AUDIENCE" TS_OAUTH_CLIENT_ID="$TS_OAUTH_CLIENT_ID" --repo jobucaldas/roomies
  cleanup:
    needs: [secrets]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Delete migration branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          expected_branch_pattern='^depot-migrate-secrets-[0123456789bcdfghjklmnpqrstvwxz]{10}$'
          if [[ ! "$GITHUB_REF_NAME" =~ $expected_branch_pattern ]]; then
            echo "Refusing to delete unexpected branch ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${GITHUB_REF_NAME}"
