name: Deploy Dev

# Builds images to GHCR, joins the cluster's tailnet with Tailscale OIDC, then
# applies deploy/kustomize/overlays/dev with kubectl.
#
# Repository secrets:
#   TS_OAUTH_CLIENT_ID  Tailscale OAuth client for the GitHub OIDC identity
#   TS_AUDIENCE         Tailscale OIDC audience
#   KUBE_CONFIG         base64 kubeconfig (namespace-scoped service account)
# Repository variable:
#   KUBE_API_SERVER     expected kubeconfig server URL; the deploy refuses
#                       any other cluster
#
# Third-party actions are pinned to commits because these jobs hold
# credentials.

# Manual only: secrets are present, but cluster bootstrap (roomies-secrets,
# Postgres, ghcr pull secret, tunnel) is still out of band — auto-deploy on
# every main push would be unsafe until that is confirmed.
on:
  workflow_dispatch:

concurrency:
  group: deploy-dev
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Build and push images
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Image tag
        id: meta
        run: echo "image_tag=sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: src/backend
          file: src/backend/Dockerfile
          push: true
          tags: |
            ghcr.io/jobucaldas/roomies-backend:sha-${{ github.sha }}

      - name: Build and push frontend
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: src/flutter/Dockerfile
          push: true
          build-args: |
            ROOMIES_API_URL=/api
          tags: |
            ghcr.io/jobucaldas/roomies-frontend:sha-${{ github.sha }}

  deploy:
    name: Tailscale deploy to roomies-dev
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      OVERLAY: deploy/kustomize/overlays/dev
      KUBECONFIG: ${{ github.workspace }}/.ci-kubeconfig
    steps:
      - name: Tailscale OIDC
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4.2.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:gha

      - uses: actions/checkout@v4

      # kubectl bundles kustomize, so no separate installer is downloaded.
      - uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4.0.1
        with:
          version: v1.35.4

      - name: Write kubeconfig
        env:
          KUBE_CONFIG_B64: ${{ secrets.KUBE_CONFIG }}
          KUBE_API_SERVER: ${{ vars.KUBE_API_SERVER }}
        run: |
          set -euo pipefail
          if [ -z "${KUBE_CONFIG_B64}" ]; then
            echo "Missing GitHub Actions secret KUBE_CONFIG (base64 kubeconfig)." >&2
            exit 1
          fi
          echo "${KUBE_CONFIG_B64}" | base64 -d > "${KUBECONFIG}"
          chmod 600 "${KUBECONFIG}"
          # Refuse any cluster other than the expected one (e.g. a LAN-only
          # URL the runner cannot reach, or the wrong context).
          if [ -z "${KUBE_API_SERVER}" ]; then
            echo "Missing repository variable KUBE_API_SERVER." >&2
            exit 1
          fi
          server="$(kubectl config view --minify -o jsonpath='{.clusters[0].cluster.server}')"
          if [ "${server}" != "${KUBE_API_SERVER}" ]; then
            echo "KUBE_CONFIG server does not match KUBE_API_SERVER." >&2
            exit 1
          fi

      - name: Pin overlay images and apply
        env:
          IMAGE_TAG: ${{ needs.publish.outputs.image_tag }}
        run: |
          set -euo pipefail
          tag="${IMAGE_TAG}"
          # Pin this run's images in a throwaway overlay on top of dev.
          pinned="${OVERLAY}-pinned"
          mkdir -p "${pinned}"
          cat > "${pinned}/kustomization.yaml" <<EOF
          apiVersion: kustomize.config.k8s.io/v1beta1
          kind: Kustomization
          resources:
            - ../dev
          images:
            - name: ghcr.io/jobucaldas/roomies-backend
              newTag: ${tag}
            - name: ghcr.io/jobucaldas/roomies-frontend
              newTag: ${tag}
          EOF
          kubectl apply -k "${pinned}"
          kubectl -n roomies-dev rollout status deployment/roomies-backend --timeout=180s
          kubectl -n roomies-dev rollout status deployment/roomies-backend-worker --timeout=180s
          kubectl -n roomies-dev rollout status deployment/roomies-frontend --timeout=180s

      - name: Smoke backend healthz via API
        run: |
          set -euo pipefail
          # Backend /healthz is not on the Ingress host (Caddy only proxies /api/*).
          kubectl -n roomies-dev port-forward svc/roomies-backend 18080:8080 >/tmp/pf.log 2>&1 &
          pf_pid=$!
          trap 'kill "${pf_pid}" >/dev/null 2>&1 || true' EXIT
          timeout 60 sh -c 'until curl -fsS http://127.0.0.1:18080/healthz; do sleep 2; done'
