name: Deploy Dev

# GitHub-hosted runners reach home-lab over Tailscale (same pattern as
# jobucaldas/dotfiles), then kubectl against the Tailscale kube VIP.
# Does not require an encom self-hosted Actions runner.
#
# Required repo secrets (names only — never commit values):
#   TS_OAUTH_CLIENT_ID  — from sibling jobucaldas/dotfiles
#   TS_AUDIENCE         — from sibling jobucaldas/dotfiles
#   KUBE_CONFIG         — base64 kubeconfig whose server is
#                         https://kube.tailbe71e1.ts.net:6443
#                         (NS-scoped SA preferred; not in sibling Tailscale workflows)

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: deploy-dev
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Build and push images
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Image tag
        id: meta
        run: echo "image_tag=sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: src/backend
          file: src/backend/Dockerfile
          push: true
          tags: |
            ghcr.io/jobucaldas/roomies-backend:sha-${{ github.sha }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/flutter/Dockerfile
          push: true
          build-args: |
            ROOMIES_API_URL=/api
          tags: |
            ghcr.io/jobucaldas/roomies-frontend:sha-${{ github.sha }}

  deploy:
    name: Tailscale deploy to roomies-dev
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      OVERLAY: deploy/kustomize/overlays/dev
      KUBECONFIG: ${{ github.workspace }}/.ci-kubeconfig
    steps:
      - name: Tailscale OIDC
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:gha

      - uses: actions/checkout@v4

      - uses: azure/setup-kubectl@v4
        with:
          version: v1.35.4

      - name: Install kustomize
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/install_kustomize.sh \
            https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh
          bash /tmp/install_kustomize.sh 5.6.3 /usr/local/bin

      - name: Write kubeconfig
        env:
          KUBE_CONFIG_B64: ${{ secrets.KUBE_CONFIG }}
        run: |
          set -euo pipefail
          if [ -z "${KUBE_CONFIG_B64}" ]; then
            echo "Missing GitHub Actions secret KUBE_CONFIG (base64 kubeconfig)." >&2
            exit 1
          fi
          echo "${KUBE_CONFIG_B64}" | base64 -d > "${KUBECONFIG}"
          chmod 600 "${KUBECONFIG}"
          # Refuse accidental LAN-only server URLs that GitHub-hosted runners
          # cannot reach even after Tailscale comes up.
          server="$(kubectl config view --minify -o jsonpath='{.clusters[0].cluster.server}')"
          case "${server}" in
            https://kube.tailbe71e1.ts.net:6443|https://kube.tailbe71e1.ts.net)
              ;;
            *)
              echo "KUBE_CONFIG server must be https://kube.tailbe71e1.ts.net:6443 (got ${server})" >&2
              exit 1
              ;;
          esac

      - name: Pin overlay images and apply
        run: |
          set -euo pipefail
          tag="${{ needs.publish.outputs.image_tag }}"
          (
            cd "${OVERLAY}"
            kustomize edit set image \
              "roomies-backend=ghcr.io/jobucaldas/roomies-backend:${tag}" \
              "roomies-frontend=ghcr.io/jobucaldas/roomies-frontend:${tag}"
          )
          kubectl apply -k "${OVERLAY}"
          kubectl -n roomies-dev rollout status deployment/roomies-backend --timeout=180s
          kubectl -n roomies-dev rollout status deployment/roomies-backend-worker --timeout=180s
          kubectl -n roomies-dev rollout status deployment/roomies-frontend --timeout=180s

      - name: Smoke backend healthz via API
        run: |
          set -euo pipefail
          # Backend /healthz is not on the Ingress host (Caddy only proxies /api/*).
          kubectl -n roomies-dev port-forward svc/roomies-backend 18080:8080 >/tmp/pf.log 2>&1 &
          pf_pid=$!
          trap 'kill "${pf_pid}" >/dev/null 2>&1 || true' EXIT
          timeout 60 sh -c 'until curl -fsS http://127.0.0.1:18080/healthz; do sleep 2; done'
