# Depot CI — the required checks for Roomies (see docs/ci.md).
# Same jobs as .github/workflows/ci.yml, which is now manual-only so pushes
# and pull requests don't run twice. Runs on Depot compute, not GitHub-hosted
# runners. Keep the two files in sync when changing a job.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    runs-on: depot-ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pre-commit
      - run: pre-commit run --show-diff-on-failure --color=always --all-files

  lint:
    runs-on: depot-ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.8'
      - run: go vet ./...
        working-directory: src/backend
        env:
          GOTOOLCHAIN: local

  backend:
    env:
      GOTOOLCHAIN: local
    runs-on: depot-ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: roomies
          POSTGRES_PASSWORD: roomies
          POSTGRES_DB: roomies
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: src/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.8'
      - run: go test ./...
        env:
          DATABASE_URL: sqlite://ci.db
          JWT_SECRET: ci-only-secret
      - run: go test ./...
        env:
          DATABASE_URL: postgres://roomies:roomies@localhost:5432/roomies?sslmode=disable
          JWT_SECRET: ci-only-secret

  flutter:
    runs-on: depot-ubuntu-latest
    defaults:
      run:
        working-directory: src/flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.1'
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web --release --no-web-resources-cdn --dart-define=ROOMIES_API_URL=/api

  android:
    runs-on: depot-ubuntu-latest
    defaults:
      run:
        working-directory: src/flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.1'
          channel: stable
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # Not every runner image ships the Android SDK; install it and accept
      # licenses instead of relying on a preinstalled one.
      - uses: android-actions/setup-android@v3
      - name: Configure release signing
        # Optional: without these secrets the APK is signed with debug keys.
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "No ANDROID_KEYSTORE_BASE64 secret: release APK uses debug keys."
            exit 0
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          {
            echo "storeFile=app/upload-keystore.jks"
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=${ANDROID_KEY_PASSWORD:-$ANDROID_KEYSTORE_PASSWORD}"
          } > android/key.properties
      - run: flutter pub get
      - run: flutter build apk --release --dart-define=ROOMIES_API_URL=
      - uses: actions/upload-artifact@v4
        with:
          name: roomies-android-apk-${{ github.sha }}
          path: src/flutter/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

  containers:
    runs-on: depot-ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure ephemeral secrets
        run: |
          jwt_secret="$(openssl rand -hex 48)"
          echo "::add-mask::${jwt_secret}"
          echo "JWT_SECRET=${jwt_secret}" >> "$GITHUB_ENV"
      - name: Compose config
        run: docker compose config
        env:
          DATABASE_URL: postgres://roomies:ci-password@db:5432/roomies?sslmode=disable
          POSTGRES_PASSWORD: ci-password
          JWT_SECRET: ${{ env.JWT_SECRET }}
      - name: Build and health smoke
        run: |
          docker compose up -d --build
          trap 'docker compose down -v' EXIT
          timeout 120 sh -c 'until curl -fsS http://localhost:58080/healthz; do sleep 2; done'
          timeout 120 sh -c 'until curl -fsS http://localhost:58000/ >/dev/null; do sleep 2; done'
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://localhost:58000/api/auth/me)" = 401
        env:
          DATABASE_URL: postgres://roomies:ci-password@db:5432/roomies?sslmode=disable
          POSTGRES_PASSWORD: ci-password
          JWT_SECRET: ${{ env.JWT_SECRET }}
          CORS_ALLOWED_ORIGINS: http://localhost:58000
          ROOMIES_BACKEND_PORT: 58080
          ROOMIES_HTTP_PORT: 58000
          ROOMIES_DB_PORT: 55432
